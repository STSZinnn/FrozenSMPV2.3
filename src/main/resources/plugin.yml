name: PunchSnowball
version: 2.3.0
main: com.example.punchsnowball.PunchSnowballPlugin
api-version: '1.21.11'
description: Frost custom PvP weapons with selection and settings menus, trust, spinning battleaxe and reactive stun-proof shield, custom hurt animations and upgraded enchantments Frozen Sword dash, Frozen Spear ice spikes and non-resurrecting Frozen Totem aura
commands:
  frost:
    description: Open the Frost weapon menu and manage Frost settings or trust
    usage: /frost
permissions:
  frost.menu:
    description: Open Frost weapon selection GUI to obtain custom weapons
    default: op
  frost.reload:
    description: Reload Frost config
    default: op
  frost.config:
    description: Open the in-game Frost settings GUI
    default: op
  frost.trust:
    description: Manage your own trusted-player list
    default: true
